services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: porachki
      MYSQL_USER: porachki
      MYSQL_PASSWORD: porachki
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3307:3306"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  api:
    build: ./backend/Porachki.Api
    depends_on:
      db: { condition: service_healthy }
    environment:
      ConnectionStrings__Default: "Server=db;Port=3306;Database=porachki;User=porachki;Password=porachki;CharSet=utf8mb4;"
      Sync__AdminApiKey: "${ADMIN_API_KEY:-change-me}"
      Estimates__AnthropicApiKey: "${ANTHROPIC_API_KEY:-}"
    ports: ["8080:8080"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8081:80"]

volumes:
  dbdata:
